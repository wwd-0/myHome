# ==============================================================================
# 全屋智能安防与双模态开门系统配置文件 (Mac 宿主机 + UTM Home Assistant)
# ==============================================================================

system:
  # 是否开启本地测试模式（true: 直接使用 Mac 自带摄像头和麦克风，按空格键模拟涂鸦传感器有人）
  test_mode: true
  # 当涂鸦传感器检测到人后，开启视觉/声纹识别的最大持续窗口时间（秒）
  active_window_sec: 15
  # 开门成功后的冷却时间（秒），防止刚开门又重复触发
  unlock_cooldown_sec: 10
  # 智能开关与自家人人脸核验互锁时间窗口（秒）：
  # C++ 收到按开关时间点的前后多少秒内人脸识别成功即判定开门（支持改为 3.0、5.0、10.0 等）
  switch_face_window_sec: 5.0

# ------------------------------------------------------------------------------
# 1. Home Assistant & 涂鸦 Zigbee 传感器 (SLZB-06 / Zigbee2MQTT) 配置
# ------------------------------------------------------------------------------
home_assistant:
  # UTM 虚拟机中 Home Assistant 的地址
  base_url: "http://homeassistant.local:8123"
  # HA 自动化中创建的 Webhook ID（无需 Token，直接触发开门或报警）
  unlock_webhook_id: "ai_door_unlock_event"
  alert_webhook_id: "ai_suspicious_alert_event"

  # MQTT 配置 (用于毫秒级接收 SLZB-06 + Zigbee2MQTT 的涂鸦人体存在传感器信号)
  mqtt:
    enabled: false  # 本地测试时可先设为 false；接通 HA MQTT 后改为 true
    broker_host: "homeassistant.local"
    broker_port: 1883
    username: ""
    password: ""
    # 涂鸦 Zigbee 人体存在传感器在 Zigbee2MQTT 中的主题名
    tuya_sensor_topic: "zigbee2mqtt/foyer_tuya_presence"
    # 触发开门识别的最大距离阈值（米）：人走近到门前 1.8 米内才开启开门认证
    trigger_distance_max_m: 1.8

# ------------------------------------------------------------------------------
# 2. 视觉模块配置 (对应目录: ./vision/)
# ------------------------------------------------------------------------------
vision:
  # 视频源：填 0 代表使用 Mac 自带摄像头；正式环境填门口摄像头的 RTSP 流地址
  # 例如: "rtsp://admin:123456@192.168.1.50:554/stream1"
  camera_source: 0

  face:
    # 存放家里 6 个人单张生活照的目录（文件名即人名，如：爸爸1.jpg、爸爸.jpg、妈妈.jpg）
    db_dir: "./vision/db/faces"
    # 存放开源人脸 ONNX 模型权重的目录（OpenCV 原生直接加载，无需 pip 安装 insightface）
    models_dir: "./vision/models"
    det_model_path: "./vision/models/face_detection_yunet_2023mar.onnx"
    rec_model_path: "./vision/models/face_recognition_sface_2021dec.onnx"
    # 余弦相似度阈值 (> 0.38 即可确认为同一人)
    similarity_threshold: 0.38
    # 最小人脸框像素宽度（过滤走廊远处路过的人，确保人在门前才触发开门）
    min_face_width_px: 90
    # 【可疑人员报警规则】陌生人在门厅停留超过多少秒触发抓拍报警
    stranger_loiter_alert_sec: 10.0
    # 【恶意遮挡报警规则】涂鸦传感器显示贴门有人(<1.2m)，但连续多少秒检测不到任何人脸
    no_face_occlusion_alert_sec: 6.0

  # 人脸抓拍快照存储配置（按身份自动分目录保存：<root_dir>/<成员名>/ 与 <root_dir>/陌生人/）
  snapshot:
    enabled: true
    # 快照保存根目录（可修改为任意相对路径或绝对路径）
    root_dir: "./output/snapshots"
    # 未识别为家庭成员时使用的独立子目录名称
    stranger_subdir: "陌生人"
    # 两次保存快照的最小时间间隔（秒），至少间隔 1.0 秒才保存下一次快照
    min_interval_sec: 2.0
    # 快照总数上限（张），超过 500 张后一次性批量删除最早的 100 张
    max_total: 500
    cleanup_batch: 100

  gesture:
    # 允许触发开门的目标手势列表 (可选: "OK", "OPEN_PALM", "VICTORY", "THUMB_UP")
    unlock_gestures:
      - "OK"
      - "VICTORY"
    # 连续多少帧检测到该手势才确认（防手臂晃动误触发，约 0.3 秒）
    confirm_frames: 5
    # 可选：专属手势绑定（如果不为空，则指定家人必须比对应手势；留空则全家人通用上面的手势）
    person_gesture_map: {}
      # "爸爸": "OK"
      # "妈妈": "VICTORY"

# ------------------------------------------------------------------------------
# 3. 音频口令与声纹模块配置 - 方案 A 两级轻量微模型级联 (对应目录: ./audio/)
#    唤醒机制: 涂鸦人体传感器触发拉流时同步从摄像头流采集音频，语音核验独立开门（无需按开关或人脸配合）
# ------------------------------------------------------------------------------
audio:
  enabled: true
  # 音频流来源: "auto" 表示跟随 vision.camera_source 从摄像头流提取音轨 (RTSP 音轨或本地麦克风)
  stream_source: "auto"
  # 存放家里最多 10 位成员语音样本的目录（16kHz 单声道 wav，支持 <人名>__<口令>_1.wav 同口令模板或 <人名>_1.wav）
  db_dir: "./audio/db/voices"
  max_members: 10
  # 第一级：BC-ResNet + MDTC 轻量口令识别与闲聊拒识 ONNX 模型
  kws_model_path: "./audio/models/command_kws_mdtc.onnx"
  # 第二级：FCM + CAM-DTDNN + ASP 轻量声纹特征提取 ONNX 模型
  sv_model_path: "./audio/models/speaker_campp_lite.onnx"
  commands_meta_path: "./audio/models/commands.json"
  # 第一级口令置信度阈值 (低于此值或命中 UNKNOWN 类则直接判定为日常闲聊丢弃)
  command_threshold: 0.55
  # 第二级声纹 1:N 余弦相似度阈值 (低于此值判定为陌生人拦截)
  similarity_threshold: 0.60
  # 每次语音核验标准分析窗口时长（秒）
  sample_duration_sec: 1.6
  # 触发语音截取的最小音量能量阈值 (RMS)，仅当检测到有效人声说话时才送入两级模型
  vad_energy_threshold: 0.015
  # 支持的 10 种开门语音口令列表
  unlock_commands:
    - "芝麻开门"
    - "开门开门"
    - "请打开门"
    - "打开房门"
    - "我回来了"
    - "芝麻请开门"
    - "你好开门"
    - "欢迎回家"
    - "请开一下门"
    - "解锁开门"
