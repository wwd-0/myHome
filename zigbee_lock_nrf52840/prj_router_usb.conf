# ==============================================================================
# 可选配置：USB 常电供电模式 (Zigbee Router 零延迟响应 + USB 串口调试日志)
# 使用方式：west build -b nice_nano_v2 -- -DCONF_FILE=prj_router_usb.conf
# ==============================================================================

CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# UF2 烧录输出
CONFIG_BUILD_OUTPUT_UF2=y
CONFIG_BUILD_OUTPUT_HEX=y
CONFIG_BUILD_OUTPUT_BIN=y

# Zigbee Router 角色 (常开接收，开锁延迟 < 20ms，同时充当家里 Zigbee 信号中继)
CONFIG_ZIGBEE=y
CONFIG_ZIGBEE_APP_UTILS=y
CONFIG_ZIGBEE_ROLE_ROUTER=y
CONFIG_ZIGBEE_CHANNEL_SELECTION_MODE_MULTI=y

# Flash 与配网持久化
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_ZIGBEE_USE_SOFTWARE_AES=y
CONFIG_CRYPTO=y
CONFIG_CRYPTO_NRF_ECB=y

CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=4096

CONFIG_MYHOME_UNLOCK_PULSE_MS=500
CONFIG_MYHOME_UNLOCK_COOLDOWN_MS=3000
