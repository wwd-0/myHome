# ==============================================================================
# Pro Micro nRF52840 (Nice!Nano v2) + PC817 Zigbee 门锁固件主配置 (prj.conf)
# 模式：Zigbee 休眠终端节点 (Sleepy End Device) + 1.5秒定时唤醒轮询 (1500ms)
# 续航：2 节 5 号优质电池可持续待机 2 年以上
# ==============================================================================

# 1. 基础内核与 GPIO 驱动
CONFIG_GPIO=y
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG=n

# 2. 低功耗与 Tickless 自动微安级休眠 (Tickless Idle)
CONFIG_PM=y
CONFIG_PM_DEVICE=y
CONFIG_TICKLESS_KERNEL=y
CONFIG_SYSTEM_CLOCK_SLOPPY_IDLE=y

# 3. 固件构建直接生成 UF2 文件 (支持免工具拖拽至 U 盘烧录)
CONFIG_BUILD_OUTPUT_UF2=y
CONFIG_BUILD_OUTPUT_HEX=y
CONFIG_BUILD_OUTPUT_BIN=y

# 4. Zigbee 协议栈 (nRF Connect SDK ZBOSS 协议栈)
CONFIG_ZIGBEE=y
CONFIG_ZIGBEE_APP_UTILS=y
CONFIG_ZIGBEE_ROLE_END_DEVICE=y
CONFIG_ZIGBEE_CHANNEL_SELECTION_MODE_MULTI=y

# 5. 网络加密与 NVRAM 断电配网持久化记忆 (Settings + Flash)
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_ZIGBEE_USE_SOFTWARE_AES=y
CONFIG_CRYPTO=y
CONFIG_CRYPTO_NRF_ECB=y

# 6. 线程栈与系统工作队列
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=4096

# 7. 门锁硬件点动脉冲与 1.5 秒休眠轮询参数
CONFIG_MYHOME_UNLOCK_PULSE_MS=300
CONFIG_MYHOME_UNLOCK_COOLDOWN_MS=2000
CONFIG_MYHOME_ZED_SLEEP_POLL_MS=1500
