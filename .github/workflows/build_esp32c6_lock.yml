name: Build MyHome Zigbee Door Lock Firmware (ESP32-C6)

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: espressif/idf:v5.1.2
      options: --user root

    steps:
      - name: Fix Git Permissions
        run: git config --global --add safe.directory '*'

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Firmware for ESP32-C6
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          cd zigbee_lock_esp32c6
          idf.py set-target esp32c6
          idf.py build
          esptool.py --chip esp32c6 merge_bin -o build/merged_firmware_0x0.bin \
            0x0 build/bootloader/bootloader.bin \
            0x8000 build/partition_table/partition-table.bin \
            0x10000 build/myhome_zigbee_lock_esp32c6.bin

      - name: Archive Binaries
        uses: actions/upload-artifact@v4
        with:
          name: myhome_esp32c6_zigbee_lock_firmware
          path: zigbee_lock_esp32c6/build/merged_firmware_0x0.bin
