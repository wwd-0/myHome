family:
  max_members: 15
  members:
  - 爸爸
  - 妈妈
  - 孩子
  - 爷爷
  - 奶奶
paths:
  best_model_path: ./weights/best_model.pth
  detector_model_path: ../vision/models/face_detection_yunet_2023mar.onnx
  gallery_file: ./data/gallery/family_gallery.json
  onnx_model_path: ./weights/best_model.onnx
  strangers_dir: ./data/dataset/strangers
  train_dir: ./data/dataset/train
  val_dir: ./data/dataset/val
  weights_dir: ./weights
system:
  device: mps
  embedding_dim: 512
  image_size:
  - 512
  - 256
  model_type: LightPersonIDNet
thresholds:
  min_face_width_px: 80
  similarity_threshold: 0.75
train:
  arcface_m: 0.5
  arcface_s: 32.0
  batch_size: 3
  epochs: 60
  lr: 0.0015
  weight_decay: 0.0005
